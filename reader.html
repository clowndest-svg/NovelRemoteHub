            <!-- 底部极简 HUD (页码进度 + 电量 + 时钟) -->
            <div id="paged-bottom-hud" class="paged-hud paged-bottom-hud">
                <span id="paged-hud-progress" class="hud-page-count">第 1 / 1 页 · 100%</span>
                <div class="hud-right-info">
                    <span id="paged-hud-battery"></span>
                    <span id="paged-hud-clock">00:00</span>
                </div>
            </div>
        </article>
    </main>

    <script>
        // 核心 Token 保持完全无损解析 (保证分享链接与账号登录双通)
        let readingToken = location.hash.startsWith('#reader.') ? location.hash.slice(1) : '';
        let readingExpiry = readingToken ? Number(readingToken.split('.')[1]) * 1000 : 0;
        let authToken = localStorage.getItem('novel_token') || '';
        let authUser = localStorage.getItem('novel_username') || 'admin';
        function activeToken() { return readingToken || authToken || ''; }
        const api = `${location.origin}/novel/api/read/`;
        const authApi = `${location.origin}/novel/api/`;
        const element = id => document.getElementById(id);

        let books = [];
        let chapters = [];
        let currentBookInfo = null;
        let currentBook = '';
        let currentFile = '';
        let catalogBook = '';
        let catalogLoadedAt = 0;
        let catalogTitle = '';
        let sequence = 0;
        let expired = false;
        let isImmersiveOpen = false;

        // 用户独立阅读缓存与个性化偏好隔离系统 (User-Scoped Storage)
        function getUserStorageKey(key) {
            const user = (authUser || 'guest').trim().toLowerCase();
            return `u_${user}_${key}`;
        }
        function getUserStorage(key, fallback = null) {
            const scopedKey = getUserStorageKey(key);
            const val = localStorage.getItem(scopedKey);
            if (val !== null && val !== undefined) return val;
            return localStorage.getItem(key) ?? fallback;
        }
        function setUserStorage(key, value) {
            const scopedKey = getUserStorageKey(key);
            localStorage.setItem(scopedKey, String(value));
        }
        function removeUserStorage(key) {
            const scopedKey = getUserStorageKey(key);
            localStorage.removeItem(scopedKey);
        }

        // 番茄个性化偏好记忆 (翻页模式、音量键、主题、字体、行距)
        let flipMode = getUserStorage('novel_reader_flip_mode', 'simulation');
        let volumeKeyEnabled = getUserStorage('novel_reader_vol_key', 'true') !== 'false';
        let currentPage = 1;
        let totalPages = 1;
        let pageStep = 0;
        let isFlipping = false;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let isSwiping = false;
        let batteryInfo = '';

        let fontSize = Number(getUserStorage('novel_reader_size', 20)) || 20;
        let currentTheme = getUserStorage('novel_reader_theme', 'sepia');
        let currentFont = getUserStorage('novel_reader_font', 'serif');
        let currentLineHeight = Number(getUserStorage('novel_reader_lh', 2.1)) || 2.1;

        function reloadUserPreferences() {
            flipMode = getUserStorage('novel_reader_flip_mode', 'simulation');
            volumeKeyEnabled = getUserStorage('novel_reader_vol_key', 'true') !== 'false';
            fontSize = Number(getUserStorage('novel_reader_size', 20)) || 20;
            currentTheme = getUserStorage('novel_reader_theme', 'sepia');
            currentFont = getUserStorage('novel_reader_font', 'serif');
            currentLineHeight = Number(getUserStorage('novel_reader_lh', 2.1)) || 2.1;

            setFlipMode(flipMode);
            setTheme(currentTheme);
            document.documentElement.setAttribute('data-font', currentFont);
            document.documentElement.style.setProperty('--reader-size', `${fontSize}px`);
            document.documentElement.style.setProperty('--reader-line-height', String(currentLineHeight));
            const indicator = element('size-indicator');
            if (indicator) indicator.textContent = `${fontSize}px`;
            const immSize = element('imm-size-label');
            if (immSize) immSize.textContent = `字号 ${fontSize}`;
            const immLh = element('imm-lh-label');
            if (immLh) immLh.textContent = `行距 ${currentLineHeight}`;
            updateVolumeKeyUI();
            updateAuthUI();
        }

        // 读者登录弹窗控制
        function openReaderLoginModal() {
            element('reader-login-user').value = authUser || 'admin';
            element('reader-login-pwd').value = '';
            element('reader-login-error').textContent = '';
            element('reader-login-modal').style.display = 'flex';
            setTimeout(() => element('reader-login-pwd').focus(), 100);
        }

        function closeReaderLoginModal(e) {
            if (e && e.target && e.target !== element('reader-login-modal')) return;
            element('reader-login-modal').style.display = 'none';
        }

        async function submitReaderLogin(event) {
            event.preventDefault();
            const btn = element('reader-login-btn');
            const errEl = element('reader-login-error');
            const userIn = element('reader-login-user');
            const pwdIn = element('reader-login-pwd');
            const username = (userIn ? userIn.value : 'admin').trim() || 'admin';
            const password = pwdIn.value;
            if (!password) { errEl.textContent = '请输入登录密码'; return; }

            btn.disabled = true;
            btn.textContent = '正在登录…';
            errEl.textContent = '';
            try {
                const res = await fetch(`${authApi}login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'same-origin'
                });
                const payload = await res.json();
                if (!res.ok || !payload.ok) {
                    errEl.textContent = payload.error || '账号或密码错误';
                    return;
                }
                authToken = payload.token;
                authUser = payload.username || username || 'admin';
                localStorage.setItem('novel_token', authToken);
                localStorage.setItem('novel_username', authUser);
                reloadUserPreferences();
                updateAuthUI();
                closeReaderLoginModal();
                alert(`✓ 欢迎您，${authUser}！已成功解锁全本精彩书卷。`);
                render();
            } catch (err) {
                errEl.textContent = err.message || '网络连接超时';
            } finally {
                btn.disabled = false;
                btn.textContent = '登 录 并 畅 读';
            }
        }

        async function readerLogout() {
            if (!confirm('确定要退出当前读者账号吗？')) return;
            try {
                await fetch(`${authApi}logout`, { method: 'POST', credentials: 'same-origin' });
            } catch (e) {}
            authToken = '';
            localStorage.removeItem('novel_token');
            localStorage.removeItem('novel_username');
            updateAuthUI();
            openReaderLoginModal();
        }

        function updateAuthUI() {
            const authLbl = element('imm-auth-label');
            if (authLbl) authLbl.textContent = authUser ? `读者:${authUser}` : '账号登录';
            const headAuth = element('btn-header-auth');
            if (headAuth) headAuth.textContent = authUser ? `👤 ${authUser}` : '👤 登录';
        }

        async function checkAuthSession() {
            try {
                const res = await fetch(`${authApi}auth_status`, {
                    headers: authToken ? { 'X-Novel-Token': authToken } : {},
                    credentials: 'same-origin'
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.authenticated) {
                        const oldUser = authUser;
                        authUser = data.username || 'admin';
                        localStorage.setItem('novel_username', authUser);
                        if (oldUser !== authUser) {
                            reloadUserPreferences();
                        }
                        updateAuthUI();
                        return true;
                    }
                }
            } catch (e) {}
            return false;
        }

        // 翻页模式设置
        function setFlipMode(mode) {
            flipMode = mode;
            setUserStorage('novel_reader_flip_mode', mode);
            document.querySelectorAll('.mode-pill, .btn-mode-pill').forEach(pill => {
                pill.classList.toggle('active', pill.classList.contains(`pill-${mode}`) || pill.classList.contains(`mode-${mode}`));
            });
            const readingEl = element('reading');
            if (readingEl) {
                readingEl.className = mode === 'scroll' ? 'mode-scroll' : `mode-paged mode-${mode}`;
                if (!readingEl.hidden) {
                    readingEl.style.display = mode === 'scroll' ? 'block' : 'flex';
                }
            }
            if (mode !== 'scroll') {
                recalcPages();
            }
        }

        function toggleVolumeKey() {
            volumeKeyEnabled = !volumeKeyEnabled;
            setUserStorage('novel_reader_vol_key', String(volumeKeyEnabled));
            updateVolumeKeyUI();
            alert(volumeKeyEnabled ? '✓ 已开启手机音量键翻页！\n按音量加键/减键即可上下翻页。' : '已关闭手机音量键翻页。');
        }

        function updateVolumeKeyUI() {
            const deskBtn = element('desk-vol-btn');
            if (deskBtn) deskBtn.textContent = volumeKeyEnabled ? '🔊 音量翻页: 开' : '🔇 音量翻页: 关';
            const immIcon = element('imm-vol-icon');
            if (immIcon) immIcon.textContent = volumeKeyEnabled ? '🔊' : '🔇';
            const immLbl = element('imm-vol-label');
            if (immLbl) immLbl.textContent = volumeKeyEnabled ? '音量翻页: 开' : '音量翻页: 关';
        }

        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            setUserStorage('novel_reader_theme', theme);
            document.querySelectorAll('.theme-pill').forEach(el => {
                el.classList.toggle('active', el.classList.contains(`pill-${theme}`));
            });
            const tNames = { sepia: '素笺主题', green: '护眼主题', dark: '暗夜主题', white: '雪白主题' };
            const immLbl = element('imm-theme-label');
            if (immLbl) immLbl.textContent = tNames[theme] || '主题切换';
        }

        function cycleTheme() {
            const list = ['sepia', 'green', 'dark', 'white'];
            const next = list[(list.indexOf(currentTheme) + 1) % list.length];
            setTheme(next);
        }

        function toggleFont() {
            currentFont = (currentFont === 'serif') ? 'sans' : 'serif';
            document.documentElement.setAttribute('data-font', currentFont);
            setUserStorage('novel_reader_font', currentFont);
        }

        function setFontDelta(delta) {
            fontSize = Math.max(16, Math.min(32, fontSize + delta));
            document.documentElement.style.setProperty('--reader-size', `${fontSize}px`);
            setUserStorage('novel_reader_size', String(fontSize));
            const indicator = element('size-indicator');
            if (indicator) indicator.textContent = `${fontSize}px`;
            const immSize = element('imm-size-label');
            if (immSize) immSize.textContent = `字号 ${fontSize}`;
            if (flipMode !== 'scroll') recalcPages();
        }

        function cycleLineHeight() {
            const list = [1.8, 2.1, 2.4];
            currentLineHeight = list[(list.indexOf(currentLineHeight) + 1) % list.length];
            document.documentElement.style.setProperty('--reader-line-height', String(currentLineHeight));
            setUserStorage('novel_reader_lh', String(currentLineHeight));
            const immLh = element('imm-lh-label');
            if (immLh) immLh.textContent = `行距 ${currentLineHeight}`;
            if (flipMode !== 'scroll') recalcPages();
        }

        function toggleImmersiveMenu() {
            isImmersiveOpen = !isImmersiveOpen;
            element('immersive-top-bar').classList.toggle('show', isImmersiveOpen);
            element('immersive-bottom-bar').classList.toggle('show', isImmersiveOpen);
        }

        function hideImmersiveMenu() {
            isImmersiveOpen = false;
            element('immersive-top-bar').classList.remove('show');
            element('immersive-bottom-bar').classList.remove('show');
        }

        // 明确的层级返回逻辑（彻底返回当前小说的目录主页）
        function backToCatalog() {
            hideImmersiveMenu();
            closeCatalogDrawer();
            const book = currentBook || (currentBookInfo ? currentBookInfo.id : '');
            if (book) {
                navigate(book, '', false);
            } else {
                navigate('', '', false);
            }
        }

        function copyCurrentShareLink() {
            const url = location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('🎉 分享阅读链接已成功复制到剪贴板！可直接发送给好友阅读。');
            }).catch(() => {
                prompt('请长按复制下方阅读链接：', url);
            });
        }

        function expire() {
            expired = true;
            sequence++;
            books = [];
            chapters = [];
            currentBookInfo = null;
            element('list').replaceChildren();
            element('breadcrumbs').replaceChildren();
            element('text').textContent = '';
            element('author-note-container').replaceChildren();
            element('book-hero').style.display = 'none';
            element('title').textContent = '阅读链接已失效';
            element('summary').textContent = '';
            element('reading').hidden = true;
            element('search').hidden = true;
            element('retry').hidden = true;
            element('message').textContent = '请向作者索取新生成的阅读链接，或输入账号密码登录。';
            element('expiry').textContent = '链接已失效';
            element('read-progress-bar').style.width = '0%';
            element('reading-hud-bar').style.display = 'none';
            hideImmersiveMenu();
        }

        async function request(resource) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 15000);
            try {
                const headers = {};
                if (readingToken) headers['X-Reading-Token'] = readingToken;
                if (authToken) headers['X-Novel-Token'] = authToken;
                const response = await fetch(api + resource, {
                    headers: headers,
                    signal: controller.signal,
                    cache: 'no-store',
                    credentials: 'same-origin'
                });
                const data = await response.json();
                if (response.status === 403 || response.status === 401) {
                    if (data && data.need_login) {
                        openReaderLoginModal();
                        throw Error("请先登录账号后再品阅");
                    }
                    if (!authToken && !readingToken) {
                        openReaderLoginModal();
                        throw Error("未登录或阅读链接已失效");
                    }
                    expire();
                    throw Error(data.error || '访问受限');
                }
                if (!response.ok) throw Error(data.error || '读取失败，请重试');
                return data;
            } finally { clearTimeout(timer); }
        }

        function button(label, action, className = '') {
            const node = document.createElement('button');
            node.textContent = label;
            node.onclick = action;
            if (className) node.className = className;
            return node;
        }

        // 核心导航状态机：如果是章节间翻页使用 replaceState，目录跳转使用 pushState
        function navigate(book = '', file = '', replace = false) {
            hideImmersiveMenu();
            closeCatalogDrawer();
            const url = new URL(location.href);
            url.search = new URLSearchParams({ ...(book ? { book } : {}), ...(file ? { file } : {}) });
            if (replace) {
                history.replaceState(null, '', url);
            } else {
                history.pushState(null, '', url);
            }
            render();
        }

        function getScaleLabel(scale) {
            if (scale === 'mid_short') return '中短篇精品';
            if (scale === 'short_story') return '爆款短故事';
            return '百万长篇巨制';
        }

        function showList() {
            const query = element('search').value.trim().toLowerCase();
            const listing = element('list');
            listing.replaceChildren();

            if (!currentBook) {
                // 书架视图：渲染图文卡片
                listing.className = 'books';
                const filtered = books.filter(b => {
                    const t = (b.title || b.id || '').toLowerCase();
                    const g = (b.genre || '').toLowerCase();
                    const d = (b.description || '').toLowerCase();
                    return t.includes(query) || g.includes(query) || d.includes(query);
                });

                for (const b of filtered) {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.onclick = () => navigate(b.id, '', false);

                    const coverWrap = document.createElement('div');
                    coverWrap.className = 'book-cover-wrap';
                    const coverImg = document.createElement('img');
                    coverImg.className = 'book-cover-img';
                    coverImg.alt = b.title;
                    coverImg.loading = 'lazy';
                    const coverUrl = b.cover_url || `${location.origin}/novel/api/read/cover?book=${encodeURIComponent(b.id)}&token=${encodeURIComponent(activeToken())}`;
                    coverImg.src = coverUrl;
                    coverImg.onerror = () => {
                        coverImg.src = `${location.origin}/novel/api/read/cover?book=${encodeURIComponent(b.id)}&token=${encodeURIComponent(activeToken())}`;
                    };
                    coverWrap.appendChild(coverImg);

                    const infoCol = document.createElement('div');
                    infoCol.className = 'book-info-col';

                    const topBlock = document.createElement('div');
                    const titleText = document.createElement('div');
                    titleText.className = 'book-title-text';
                    titleText.textContent = b.title || b.id;

                    const badgesBox = document.createElement('div');
                    badgesBox.className = 'book-badges';
                    badgesBox.innerHTML = `
                        <span class="badge">${b.genre || '精品网文'}</span>
                        <span class="badge badge-gray">${getScaleLabel(b.novel_type)}</span>
                        <span class="badge badge-gray">${b.chapter_count} 章</span>
                        ${b.word_count ? `<span class="badge badge-gray">${(b.word_count / 10000).toFixed(1)} 万字</span>` : ''}
                    `;

                    const authorLine = document.createElement('div');
                    authorLine.className = 'book-author-line';
                    authorLine.textContent = `✍️ 作者：${b.author || '网络作家'}`;

                    const descSnippet = document.createElement('div');
                    descSnippet.className = 'book-desc-snippet';
                    descSnippet.textContent = b.description || '点击打开目录，立即沉浸品阅精彩正文！';

                    topBlock.append(titleText, badgesBox, authorLine, descSnippet);

                    const actionsBox = document.createElement('div');
                    actionsBox.className = 'book-card-actions';

                    const openBtn = document.createElement('button');
                    openBtn.className = 'btn-card-primary';
                    openBtn.textContent = '📖 查看目录';
                    openBtn.onclick = (e) => { e.stopPropagation(); navigate(b.id, '', false); };
                    actionsBox.appendChild(openBtn);

                    const lastFile = getUserStorage(`novel_reader_last_${b.id}`);
                    const lastTitle = getUserStorage(`novel_reader_last_title_${b.id}`);
                    if (lastFile) {
                        const resumeBtn = document.createElement('button');
                        resumeBtn.className = 'btn-card-resume';
                        resumeBtn.textContent = `🔖 续读`;
                        resumeBtn.title = `继续阅读：${lastTitle || lastFile}`;
                        resumeBtn.onclick = (e) => { e.stopPropagation(); navigate(b.id, lastFile, false); };
                        actionsBox.appendChild(resumeBtn);
                    }

                    infoCol.append(topBlock, actionsBox);
                    card.append(coverWrap, infoCol);
                    listing.appendChild(card);
                }
                element('message').textContent = filtered.length ? '' : query ? '没有匹配的作品' : '书库暂无公开作品';
            } else {
                // 章节目录视图
                listing.className = 'chapters';
                const filtered = chapters.filter(c => c.title.toLowerCase().includes(query) || (c.filename && c.filename.toLowerCase().includes(query)));
                const lastRead = getUserStorage(`novel_reader_last_${currentBook}`);

                for (const item of filtered) {
                    const row = document.createElement('button');
                    row.className = 'chapter-row' + (item.filename === lastRead ? ' is-last-read' : '');
                    row.onclick = () => navigate(currentBook, item.filename, false);

                    const leftBox = document.createElement('div');
                    leftBox.style.display = 'flex';
                    leftBox.style.alignItems = 'center';
                    leftBox.style.gap = '8px';

                    if (item.filename === lastRead) {
                        const mark = document.createElement('span');
                        mark.style.cssText = 'color:var(--accent); font-size:11px; font-weight:700;';
                        mark.textContent = '● 上次读到';
                        leftBox.appendChild(mark);
                    }

                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'chapter-title-strong';
                    titleSpan.textContent = item.title;
                    leftBox.appendChild(titleSpan);

                    const metaSpan = document.createElement('span');
                    metaSpan.className = 'chapter-meta-tag';
                    const words = item.char_count || 0;
                    const estMin = Math.max(1, Math.round(words / 400));
                    metaSpan.textContent = `${words} 字 · 约 ${estMin} 分钟`;

                    row.append(leftBox, metaSpan);
                    listing.appendChild(row);
                }
                element('message').textContent = filtered.length ? '' : query ? '未检索到对应章节' : '作者尚未上传正文章节';
            }
        }

        function renderHeroCard(bookInfo) {
            const hero = element('book-hero');
            if (!bookInfo) {
                hero.style.display = 'none';
                return;
            }
            hero.style.display = 'flex';

            const coverUrl = bookInfo.cover_url || `${location.origin}/novel/api/read/cover?book=${encodeURIComponent(bookInfo.id)}&token=${encodeURIComponent(activeToken())}`;
            const lastFile = getUserStorage(`novel_reader_last_${bookInfo.id}`);
            const lastTitle = getUserStorage(`novel_reader_last_title_${bookInfo.id}`);

            hero.innerHTML = `
                <div class="hero-cover-wrap">
                    <img class="hero-cover-img" src="${coverUrl}" alt="${bookInfo.title}" onerror="this.src='${location.origin}/novel/api/read/cover?book=${encodeURIComponent(bookInfo.id)}&token=${encodeURIComponent(activeToken())}'">
                </div>
                <div class="hero-info-wrap">
                    <div>
                        <h2 class="hero-title">${bookInfo.title}</h2>
                        <div class="hero-meta-row">
                            <span class="badge">${bookInfo.genre || '精品力作'}</span>
                            <span class="badge badge-gray">${getScaleLabel(bookInfo.novel_type)}</span>
                            <span>✍️ 作者：<b>${bookInfo.author || '网络作家'}</b></span>
                            <span>📚 连载：<b>${bookInfo.chapter_count || chapters.length} 章</b></span>
                            ${bookInfo.total_words ? `<span>📊 总字数：<b>${(bookInfo.total_words / 10000).toFixed(1)} 万字</b></span>` : ''}
                        </div>
                        <div id="hero-desc" class="hero-desc-box">
                            ${bookInfo.description ? bookInfo.description.replace(/\n/g, '<br>') : '暂无作品简介。'}
                        </div>
                        ${(bookInfo.description && bookInfo.description.length > 90) ? `
                            <button id="btn-toggle-desc" class="btn-desc-toggle" onclick="toggleHeroDesc()">展开完整简介 ▼</button>
                        ` : ''}
                    </div>
                    <div class="hero-cta-bar">
                        ${chapters.length > 0 ? `
                            <button class="btn-cta-read" onclick="navigate('${bookInfo.id}', '${chapters[0].filename}', false)">
                                🚀 从第 1 章开始阅读
                            </button>
                        ` : ''}
                        ${(lastFile && chapters.some(c => c.filename === lastFile)) ? `
                            <button class="btn-cta-continue" onclick="navigate('${bookInfo.id}', '${lastFile}', false)">
                                🔖 继续阅读：${lastTitle || '上次章节'}
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        window.toggleHeroDesc = function() {
            const desc = element('hero-desc');
            const btn = element('btn-toggle-desc');
            if (!desc) return;
            const isExp = desc.classList.toggle('expanded');
            if (btn) btn.textContent = isExp ? '收起简介 ▲' : '展开完整简介 ▼';
        };

        // 侧边目录抽屉 (平滑滑出，自动聚焦当前章节)
        function openCatalogDrawer() {
            element('catalog-drawer-overlay').classList.add('open');
            element('catalog-drawer').classList.add('open');
            element('drawer-book-title').textContent = catalogTitle || currentBook || '章节目录';
            const sInput = element('drawer-search');
            if (sInput) sInput.value = '';
            renderDrawerChapters(chapters);
            setTimeout(() => {
                const cont = element('drawer-chapters-container');
                if (cont) {
                    const activeEl = cont.querySelector('.drawer-chapter-item.active');
                    if (activeEl) {
                        activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    }
                }
            }, 80);
        }

        function closeCatalogDrawer() {
            element('catalog-drawer-overlay').classList.remove('open');
            element('catalog-drawer').classList.remove('open');
        }

        function renderDrawerChapters(list) {
            const cont = element('drawer-chapters-container');
            cont.replaceChildren();
            const q = (element('drawer-search').value || '').trim().toLowerCase();
            const filtered = list.filter(c => c.title.toLowerCase().includes(q) || (c.filename && c.filename.toLowerCase().includes(q)));

            filtered.forEach(c => {
                const item = document.createElement('div');
                item.className = 'drawer-chapter-item' + (c.filename === currentFile ? ' active' : '');
                item.textContent = c.title;
                item.onclick = () => {
                    navigate(currentBook, c.filename, true);
                    closeCatalogDrawer();
                };
                cont.appendChild(item);
            });
        }

        function filterDrawerChapters() {
            renderDrawerChapters(chapters);
        }

        // 翻页操作 (使用 replaceState，不堆叠历史栈)
        function goToPrevChapter() {
            const idx = chapters.findIndex(c => c.filename === currentFile);
            if (idx > 0) {
                navigate(currentBook, chapters[idx - 1].filename, true);
            }
        }

        function goToNextChapter() {
            const idx = chapters.findIndex(c => c.filename === currentFile);
            if (idx >= 0 && idx < chapters.length - 1) {
                navigate(currentBook, chapters[idx + 1].filename, true);
            }
        }

        // 实时时钟更新
        function updateHudClock() {
            const el = element('hud-clock-time');
            const pagedClock = element('paged-hud-clock');
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const timeStr = `${h}:${m}`;
            if (el) el.textContent = timeStr;
            if (pagedClock) pagedClock.textContent = timeStr;
        }
        setInterval(updateHudClock, 10000);
        updateHudClock();

        // 精确单页分页与零累积误差计算 (彻底解决断字、列错位腰斩问题)
        function recalcPages() {
            if (element('reading').hidden || flipMode === 'scroll') return;
            const viewport = element('paged-viewport');
            const track = element('paged-track');
            if (!viewport || !track) return;
            
            const w = viewport.clientWidth;
            if (w <= 0) return;

            pageStep = w;
            track.style.width = '100%';
            track.style.columnWidth = `${w}px`;
            track.style.columnGap = '0px';
            track.style.setProperty('--page-step', `${pageStep}px`);
            
            requestAnimationFrame(() => {
                const totalW = track.scrollWidth;
                totalPages = Math.max(1, Math.round(totalW / w));
                currentPage = Math.max(1, Math.min(currentPage, totalPages));
                updatePagePosition(false);
            });
        }

        function updatePagePosition(animate = true, direction = 'next') {
            const track = element('paged-track');
            if (!track) return;
            track.style.setProperty('--cur-page', String(currentPage));
            track.style.setProperty('--page-step', `${pageStep}px`);
            const targetX = -1 * (currentPage - 1) * pageStep;
            
            if (animate && flipMode === 'simulation') {
                track.classList.remove('flip-anim-next', 'flip-anim-prev');
                void track.offsetWidth;
                track.classList.add(direction === 'next' ? 'flip-anim-next' : 'flip-anim-prev');
                setTimeout(() => {
                    track.style.transform = `translateX(${targetX}px)`;
                    track.classList.remove('flip-anim-next', 'flip-anim-prev');
                }, 280);
            } else if (animate && flipMode === 'slide') {
                track.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
                track.style.transform = `translateX(${targetX}px)`;
            } else {
                track.style.transition = 'none';
                track.style.transform = `translateX(${targetX}px)`;
            }

            const pct = totalPages > 0 ? Math.round((currentPage / totalPages) * 100) : 100;
            const progEl = element('paged-hud-progress');
            if (progEl) progEl.textContent = `第 ${currentPage} / ${totalPages} 页 · ${pct}%`;
            const immProgEl = element('imm-progress-label');
            if (immProgEl) {
                const chapIdx = chapters.findIndex(c => c.filename === currentFile);
                immProgEl.textContent = `第 ${chapIdx + 1} / ${chapters.length} 章 · 本章第 ${currentPage}/${totalPages} 页 (${pct}%)`;
            }
        }

        function flipNext() {
            if (element('reading').hidden) return;
            if (flipMode === 'scroll') {
                window.scrollBy({ top: window.innerHeight * 0.8, behavior: 'smooth' });
                return;
            }
            if (isFlipping) return;
            if (currentPage < totalPages) {
                isFlipping = true;
                currentPage++;
                updatePagePosition(true, 'next');
                setTimeout(() => { isFlipping = false; }, 300);
            } else {
                goToNextChapter();
            }
        }

        function flipPrev() {
            if (element('reading').hidden) return;
            if (flipMode === 'scroll') {
                window.scrollBy({ top: -window.innerHeight * 0.8, behavior: 'smooth' });
                return;
            }
            if (isFlipping) return;
            if (currentPage > 1) {
                isFlipping = true;
                currentPage--;
                updatePagePosition(true, 'prev');
                setTimeout(() => { isFlipping = false; }, 300);
            } else {
                goToPrevChapter();
            }
        }

        function onTapLeft(e) {
            e.stopPropagation();
            flipPrev();
        }

        function onTapRight(e) {
            e.stopPropagation();
            flipNext();
        }

        function onTapCenter(e) {
            e.stopPropagation();
            toggleImmersiveMenu();
        }

        async function render() {
            const hasValidLink = readingToken && readingToken.startsWith('reader.') && Number.isFinite(readingExpiry) && Date.now() < readingExpiry;
            let isAuthed = !!authToken;
            if (!hasValidLink && !isAuthed) {
                const cookieOk = await checkAuthSession();
                if (cookieOk) {
                    isAuthed = true;
                    authToken = localStorage.getItem('novel_token') || 'cookie_session';
                } else {
                    openReaderLoginModal();
                    element('message').textContent = '请先输入读者或管理员账号登录，或通过作者生成的专属分享链接访问。';
                    return;
                }
            }

            const requestId = ++sequence;
            const params = new URLSearchParams(location.search);
            currentBook = params.get('book') || '';
            currentFile = params.get('file') || '';

            element('reading').hidden = true;
            element('reading').style.display = 'none';
            element('text').textContent = '';
            element('author-note-container').replaceChildren();
            element('list').replaceChildren();
            element('search').hidden = true;
            element('search').value = '';
            element('retry').hidden = true;
            element('summary').textContent = '';
            element('book-hero').style.display = 'none';
            element('message').textContent = '正在获取精彩正文…';
            element('breadcrumbs').replaceChildren(button('📚 小说书架', () => navigate('', '', false)));
            element('read-progress-bar').style.width = '0%';
            element('reading-hud-bar').style.display = 'none';

            try {
                if (!currentBook) {
                    // 1. 书架首页
                    element('global-header').style.display = 'block';
                    element('title').textContent = '小说书架';
                    const result = await request('books?details=1');
                    if (requestId !== sequence) return;
                    books = result.books || [];
                    element('summary').textContent = `共收录 ${books.length} 部精品力作 · 点击卡片随时品阅`;
                    element('search').placeholder = '搜索书名、作者或题材标签';
                    element('search').hidden = false;
                    showList();
                } else {
                    // 2. 目录主页或正文阅读页
                    const book = currentBook;
                    const filename = currentFile;
                    const cachedCatalog = filename && catalogBook === book && Date.now() - catalogLoadedAt < 30000;
                    
                    const [result, chapter] = await Promise.all([
                        cachedCatalog ? Promise.resolve({ chapters, book_title: catalogTitle, book_info: currentBookInfo }) : request('chapters?' + new URLSearchParams({ book })),
                        filename ? request('chapter?' + new URLSearchParams({ book, file: filename })) : Promise.resolve(null)
                    ]);
                    if (requestId !== sequence) return;

                    chapters = result.chapters || [];
                    if (!cachedCatalog) catalogLoadedAt = Date.now();
                    catalogBook = book;
                    catalogTitle = result.book_title || book;
                    currentBookInfo = result.book_info || { id: book, title: catalogTitle, chapter_count: chapters.length };

                    element('breadcrumbs').append(document.createTextNode(' / '), button(`《${catalogTitle}》`, () => navigate(book, '', false)));

                    if (filename && chapter) {
                        // 3. 正文沉浸阅读页
                        element('global-header').style.display = 'none'; // 沉浸式全屏
                        element('title').textContent = '';
                        element('summary').textContent = '';
                        element('chapter-title').textContent = chapter.title;
                        element('imm-title-label').textContent = `${catalogTitle} · ${chapter.title}`;
                        element('paged-hud-book-title').textContent = `《${catalogTitle}》`;
                        element('paged-hud-chapter-title').textContent = chapter.title;
                        
                        // 记忆阅读进度 (用户隔离)
                        setUserStorage(`novel_reader_last_${book}`, filename);
                        setUserStorage(`novel_reader_last_title_${book}`, chapter.title);

                        const index = chapters.findIndex(item => item.filename === filename);
                        const progressPct = chapters.length > 0 ? Math.round(((index + 1) / chapters.length) * 100) : 0;
                        element('read-progress-bar').style.width = `${progressPct}%`;

                        const charCount = (chapter.content || '').length;
                        const estMin = Math.max(1, Math.round(charCount / 400));
                        element('chapter-info').textContent = `字数：${charCount} 字 · 预计阅读 ${estMin} 分钟 · 本书第 ${index + 1} / ${chapters.length} 章 (${progressPct}%)`;

                        // 更新沉浸底部与 HUD 指示
                        element('imm-progress-label').textContent = `第 ${index + 1} / ${chapters.length} 章 (${progressPct}%)`;
                        element('imm-prev-btn').disabled = index <= 0;
                        element('imm-next-btn').disabled = index < 0 || index >= chapters.length - 1;
                        element('hud-chapter-progress').textContent = `${chapter.title.split(' ')[0] || `第${index + 1}章`} · ${progressPct}%`;
                        element('reading-hud-bar').style.display = 'flex';

                        // 处理正文段落与作者有话说
                        const fullContent = chapter.content || '';
                        let mainText = fullContent;
                        let authorNote = '';
                        const noteMarker = fullContent.indexOf('【作者有话说】') !== -1 ? '【作者有话说】' : 
                                          (fullContent.indexOf('【作家的话】') !== -1 ? '【作家的话】' : '');
                        if (noteMarker) {
                            const splitIdx = fullContent.indexOf(noteMarker);
                            mainText = fullContent.slice(0, splitIdx).trim();
                            authorNote = fullContent.slice(splitIdx).trim();
                        }

                        // 格式化段落排版 (严格段首缩进两字符)
                        const textNode = element('text');
                        textNode.replaceChildren();
                        const paras = mainText.split('\n');
                        for (const p of paras) {
                            const trimmed = p.trim();
                            if (trimmed) {
                                const pEl = document.createElement('p');
                                pEl.textContent = trimmed;
                                textNode.appendChild(pEl);
                            }
                        }

                        // 渲染作者有话说专栏
                        const noteContainer = element('author-note-container');
                        noteContainer.replaceChildren();
                        if (authorNote) {
                            const noteBox = document.createElement('div');
                            noteBox.className = 'author-note-box';
                            noteBox.innerHTML = `
                                <div class="author-note-header">✍️ 作者有话说 / 读者互动</div>
                                <div style="white-space:pre-wrap;">${authorNote.replace(noteMarker, '').trim()}</div>
                            `;
                            noteContainer.appendChild(noteBox);
                        }

                        element('reading').hidden = false;
                        element('reading').style.display = flipMode === 'scroll' ? 'block' : 'flex';
                        element('message').textContent = '';

                        // 翻页控制
                        element('previous').disabled = index <= 0;
                        element('next').disabled = index < 0 || index >= chapters.length - 1;
                        element('previous').onclick = () => {
                            if (index > 0) navigate(book, chapters[index - 1].filename, true);
                        };
                        element('next').onclick = () => {
                            if (index >= 0 && index < chapters.length - 1) navigate(book, chapters[index + 1].filename, true);
                        };
                        element('catalog').onclick = () => backToCatalog();

                        // 翻页模式应用与重排
                        currentPage = 1;
                        setFlipMode(flipMode);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        return;
                    }

                    // 4. 目录主页：展示 Hero 卡片和章节列表
                    element('global-header').style.display = 'block';
                    element('title').textContent = catalogTitle;
                    element('summary').textContent = `共 ${chapters.length} 章节 · 点击卡片进入沉浸阅读`;
                    renderHeroCard(currentBookInfo);

                    element('search').placeholder = '搜索章节名称或序号 (如 001 或 始皇)';
                    element('search').hidden = false;
                    showList();
                }
            } catch (error) {
                if (requestId !== sequence || expired) return;
                element('message').textContent = error.name === 'AbortError' ? '网络请求超时，请重试' : error.message;
                element('retry').hidden = false;
            }
        }

        // 触控滑动手势
        const readingEl = element('reading');
        if (readingEl) {
            readingEl.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    touchStartTime = Date.now();
                    isSwiping = false;
                }
            }, { passive: true });

            readingEl.addEventListener('touchmove', (e) => {
                if (flipMode !== 'scroll' && e.touches.length === 1) {
                    const dx = e.touches[0].clientX - touchStartX;
                    const dy = e.touches[0].clientY - touchStartY;
                    if (Math.abs(dx) > Math.abs(dy) * 1.3 && Math.abs(dx) > 10) {
                        isSwiping = true;
                    }
                }
            }, { passive: true });

            readingEl.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1 && flipMode !== 'scroll') {
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    const dy = e.changedTouches[0].clientY - touchStartY;
                    const dt = Date.now() - touchStartTime;
                    if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy) * 1.2 && dt < 600) {
                        isSwiping = true;
                        if (dx < 0) flipNext();
                        else flipPrev();
                    }
                }
            }, { passive: true });
        }

        // 快捷键 & 手机物理音量键翻页
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCatalogDrawer();
                hideImmersiveMenu();
                return;
            }
            if (element('reading').hidden) return;

            // 物理音量键翻页
            if (e.key === 'VolumeDown' || e.key === 'AudioVolumeDown' || e.code === 'AudioVolumeDown') {
                if (volumeKeyEnabled) {
                    e.preventDefault();
                    e.stopPropagation();
                    flipNext();
                    return;
                }
            }
            if (e.key === 'VolumeUp' || e.key === 'AudioVolumeUp' || e.code === 'AudioVolumeUp') {
                if (volumeKeyEnabled) {
                    e.preventDefault();
                    e.stopPropagation();
                    flipPrev();
                    return;
                }
            }

            // 键盘翻页
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                e.preventDefault();
                flipNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                flipPrev();
            }
        }, { passive: false });

        // 电池电量指示器
        if ('getBattery' in navigator) {
            navigator.getBattery().then(battery => {
                const updateBatt = () => {
                    batteryInfo = `🔋${Math.round(battery.level * 100)}%`;
                    const bEl = element('paged-hud-battery');
                    if (bEl) bEl.textContent = batteryInfo;
                };
                updateBatt();
                battery.addEventListener('levelchange', updateBatt);
            }).catch(() => {});
        }

        window.addEventListener('resize', () => {
            if (flipMode !== 'scroll') recalcPages();
        });

        element('search').oninput = showList;
        element('retry').onclick = render;

        window.addEventListener('popstate', render);
        window.addEventListener('hashchange', () => location.reload());
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && readingExpiry && Date.now() >= readingExpiry && !authToken) expire();
        });

        if (Number.isFinite(readingExpiry) && readingExpiry > Date.now()) {
            element('expiry').textContent = `有效至 ${new Date(readingExpiry).toLocaleString('zh-CN', { hour12: false })}`;
            setTimeout(expire, Math.min(readingExpiry - Date.now(), 2147483647));
        }

        // 初始化视觉状态与偏好
        setTheme(currentTheme);
        document.documentElement.setAttribute('data-font', currentFont);
        setFontDelta(0);
        updateAuthUI();
        updateVolumeKeyUI();
        render();
    </script>
</body>
</html>
